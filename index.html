<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Distraction Free</title>
  <style>
    /* ... your existing styles ... */
  </style>
</head>
<body>
  <div class="container">
    <h1>Distraction Free</h1>
    <div id="status">Monitoring window activity…</div>
    <h2>Distraction History</h2>
    <button id="refresh">Refresh History</button>
    <div id="history">No records yet.</div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const statusDiv  = document.getElementById('status');
    const historyDiv = document.getElementById('history');
    const refreshBtn = document.getElementById('refresh');

    ipcRenderer.on('status-update', (_, data) => {
      statusDiv.innerText = `${data.classification.toUpperCase()}: ${data.process} — ${data.title}`;
      statusDiv.style.background =
        data.classification === 'distraction' ? '#ffcdd2' : '#e8f5e9';
    });

    ipcRenderer.on('screenshot-analysis', (_, { text }) => {
      statusDiv.innerText = `📸 ${text.split('\n')[0]}`;
      statusDiv.style.background = '#FFF9C4';
    });

    ipcRenderer.on('distraction-recorded', (_, rec) => {
      prependEntry(rec);
    });

    async function loadHistory() {
      const list = await ipcRenderer.invoke('get-distraction-history');
      historyDiv.innerHTML = '';
      if (!list.length) {
        historyDiv.innerText = 'No records yet.';
        return;
      }
      list.forEach(rec => prependEntry(rec, false));
    }

    function prependEntry({ process, title, start, duration }, scroll=true) {
      const el = document.createElement('div');
      el.className = 'entry';
      const t = new Date(start).toLocaleTimeString();
      el.innerText = `${t} • ${process} — "${title}" (${Math.round(duration/1000)}s)`;
      historyDiv.prepend(el);
      if (scroll) historyDiv.scrollTop = 0;
    }

    refreshBtn.onclick = loadHistory;
    document.addEventListener('DOMContentLoaded', loadHistory);
  </script>
</body>
</html>
