<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Distraction Free</title>
  <style>
    /* ... your existing styles ... */
    #controls { margin-top:10px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Distraction Free</h1>
    <!-- Controls -->
    <div id="controls">
      <button id="togglePause">…</button>
    </div>

    <div id="status">Loading…</div>

    <h2>Distraction History</h2>
    <button id="refresh">Refresh History</button>
    <div id="history">No records yet.</div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const toggleBtn = document.getElementById('togglePause');
    const statusDiv = document.getElementById('status');
    const historyDiv= document.getElementById('history');
    const refreshBtn= document.getElementById('refresh');

    // Update button text based on paused state
    function setPausedUI(paused) {
      toggleBtn.innerText = paused ? '▶️ Resume' : '⏸️ Pause';
      statusDiv.innerText = paused
        ? '⏸️ Detection Paused'
        : '✔️ Detection Active';
      statusDiv.style.background = paused ? '#ffe0b2' : '#e8f5e9';
    }

    // On load, ask main for current state
    ipcRenderer.invoke('get-paused-state').then(setPausedUI);

    // Listen for changes
    ipcRenderer.on('paused-state', (_, paused) => setPausedUI(paused));

    // Toggle on button click
    toggleBtn.onclick = () => {
      ipcRenderer.send('toggle-pause');
    };

    // Status updates for window classification
    ipcRenderer.on('status-update', (_, data) => {
      if (!data) return;
      statusDiv.innerText = `${data.classification.toUpperCase()}: ${data.process} — ${data.title}`;
      statusDiv.style.background =
        data.classification==='distraction' ? '#ffcdd2' : '#e8f5e9';
    });

    // History handling
    ipcRenderer.on('distraction-recorded', (_, rec) => prependEntry(rec));
    async function loadHistory() {
      const list = await ipcRenderer.invoke('get-distraction-history');
      historyDiv.innerHTML = '';
      if (!list.length) return historyDiv.innerText='No records yet.';
      list.forEach(r=>prependEntry(r,false));
    }
    refreshBtn.onclick = loadHistory;

    function prependEntry({process,title,start,duration}, scroll=true){
      const el = document.createElement('div');
      el.className='entry';
      const t=new Date(start).toLocaleTimeString();
      el.innerText=`${t} • ${process} — "${title}" (${Math.round(duration/1000)}s)`;
      historyDiv.prepend(el);
      if(scroll) historyDiv.scrollTop=0;
    }

    document.addEventListener('DOMContentLoaded',()=>{
      setPausedUI(false);
      loadHistory();
    });
  </script>
</body>
</html>
